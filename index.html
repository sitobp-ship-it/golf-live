<style>
:root{
  --verde-negro:#081a13; --verde-oscuro:#0d3a26; --verde-campo:#155c39; --verde-fairway:#1f7a4d; --verde-claro:#3fa66b;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,var(--verde-negro),var(--verde-oscuro) 45%,#0a2c1c 100%);color:var(--crema);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}

.brand span{color:var(--dorado-claro);}

input[type=text],input[type=number],input[type=password],select{width:100%;background:#0a2416;border:1.5px solid var(--gris-linea);color:#fff;padding:13px 14px;border-radius:12px;font-size:16px;font-family:'Inter';outline:none;}

.tab-btn.active{background:var(--dorado);color:#3a2c05;border-color:var(--dorado);}

.gold-box .num{font-family:'Bebas Neue';font-size:76px;line-height:.95;color:#fff;}
.gold-box .lbl{font-size:11px;letter-spacing:1px;color:var(--dorado-claro);text-transform:uppercase;margin-top:2px;}
.gold-box .navrow{display:flex;justify-content:center;gap:8px;margin-top:12px;}
.nav-btn{background:rgba(255,255,255,.08);border:1.5px solid var(--gris-linea);color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:700;flex:1;font-family:'Inter';}
.nav-btn:disabled{opacity:.25;}
.stepper-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid var(--gris-linea);color:#fff;font-size:22px;cursor:pointer;}

.small-gold .v{font-family:'Bebas Neue';font-size:30px;color:#fff;}

.holes-panel{margin-top:14px;}
.holes-panel h5{font-family:'Bebas Neue';font-size:14px;letter-spacing:.6px;color:var(--dorado-claro);margin:14px 0 6px;}
.holes-panel td:first-child,.holes-panel th:first-child{position:sticky;left:0;background:#0d1f16;}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-bottom));transform:translateX(-50%);background:#2a0f0c;border:1px solid rgba(255,138,128,.5);color:#ffb3ab;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90vw;box-shadow:var(--sombra);}
.toast.good{background:#0c2a18;border-color:rgba(127,227,163,.5);color:#7fe3a3;}
</style>

<body>
<div id="app"></div>
<script>
/* =========================================================
   GOLF LIVE — versión simplificada conectada a Supabase
   (Medal / Stableford, 18 hoyos, tee Amarillo o Rojo)
   La clave "anon" es pública por diseño; las tablas de campos
   son de solo lectura y se modifican vía RPC con clave.
   ========================================================= */
const SUPABASE_URL = 'https://nyrazvjukcseqrskkwvg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55cmF6dmp1a2NzZXFyc2trd3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODg4MzAsImV4cCI6MjEwNTE2NDgzMH0.k2NCRlhn9hn_gZYT-7Jm6mLQt9XXdQU87CkwlaQxwG0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const HOLES = 18;
const TEES = ['Amarillo','Rojo'];
const TEE_DEFAULT = 'Amarillo';
const TEE_COLOR = { Amarillo:'#e3c34a', Rojo:'#e0574a' };

/* ---------------- helpers ---------------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseNum(v){ const n = parseFloat(String(v ?? '').trim().replace(',','.')); return isNaN(n) ? NaN : n; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function card(inner){ const d=document.createElement('div'); d.className='card'; d.innerHTML=inner; return d; }
function stepsBar(step,total,label){
  const dots=Array.from({length:total},(_,i)=>`<div class="dot ${i<step-1?'done':i===step-1?'active':''}"></div>`).join('');
  return `<div class="steps">${dots}</div><div class="steps-label">Paso ${step} de ${total} · ${esc(label)}</div>`;
}
function sistemaLabel(s){ return s==='stableford' ? 'Stableford' : 'Medal'; }
function fmtDiff(n){ return (n>0?'+':'') + n; }
let toastTimer=null;
function toast(msg, good){
  let t=document.querySelector('.toast');
  if(!t){ t=document.createElement('div'); document.body.appendChild(t); }
  t.className='toast'+(good?' good':''); t.textContent=msg;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), 3500);
}

/* sesión local: recuerda en qué partida y con qué jugador estás */
const SESSION_KEY='golflive.session';
const Session={
  get(){ try{ const s=JSON.parse(localStorage.getItem(SESSION_KEY)); return (s && s.code && s.playerId) ? s : null; }catch(e){ return null; } },
  set(code,playerId){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify({code,playerId})); }catch(e){} },
  clear(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
};

/* ---------------- catálogo: campos, hoyos, tablas de hándicap ---------------- */
const CAT = { ready:false, error:null, campos:[], byId:{}, hoyos:{}, tramos:{}, tees:{} };
async function loadCatalog(){
  const [c,h,t,tc] = await Promise.all([
    sb.from('campos').select('*').order('nombre'),
    sb.from('hoyos').select('*'),
    sb.from('campos_handicap').select('*').in('tee', TEES),
    sb.from('tees_campo').select('*').in('tee', TEES),
  ]);
  for (const r of [c,h,t,tc]) if (r.error) throw r.error;
  CAT.campos = (c.data||[]).map(r=>({ id:r.id, nombre:r.nombre, imagen:r.imagen_url }));
  CAT.byId = {}; CAT.campos.forEach(x=>CAT.byId[x.id]=x);
  CAT.hoyos = {};
  (h.data||[]).forEach(r=>{ (CAT.hoyos[r.campo_id] ||= []).push({ n:r.numero, par:r.par, hcp:r.indice_handicap }); });
  Object.values(CAT.hoyos).forEach(a=>a.sort((x,y)=>x.n-y.n));
  CAT.tramos = {};
  (t.data||[]).forEach(r=>{
    const byTee = (CAT.tramos[r.campo_id] ||= {});
    (byTee[r.tee] ||= []).push({ desde:Number(r.hcp_desde), hasta:Number(r.hcp_hasta), slope:r.hcp_campo });
  });
  Object.values(CAT.tramos).forEach(bt=>Object.values(bt).forEach(a=>a.sort((x,y)=>x.desde-y.desde)));
  CAT.tees = {};
  (tc.data||[]).forEach(r=>{ (CAT.tees[r.campo_id] ||= {})[r.tee] = { cr:Number(r.cr), sr:Number(r.sr), par:Number(r.par) }; });
  CAT.ready = true; CAT.error = null;
}

/* 18 hoyos del campo (par + índice de hándicap); plantilla si faltasen */
function courseHoles(campoId){
  const h = CAT.hoyos[campoId];
  if (h && h.length===HOLES) return h;
  return Array.from({length:HOLES},(_,i)=>({ n:i+1, par:4, hcp:i+1 }));
}
function coursePar(campoId){ return courseHoles(campoId).reduce((s,h)=>s+h.par,0); }

/* SLOPE (hándicap de campo) según tabla de tramos del campo/tee;
   si no hay tabla, fórmula WHS con CR/SR; si tampoco, null */
function slopeSource(campoId, tee){
  if (((CAT.tramos[campoId]||{})[tee]||[]).length) return 'tabla';
  if ((CAT.tees[campoId]||{})[tee]) return 'formula';
  return null;
}
function slopeFor(campoId, tee, hcp){
  if (isNaN(hcp)) return null;
  const rows = (CAT.tramos[campoId]||{})[tee] || [];
  if (rows.length){
    for (const r of rows) if (hcp>=r.desde && hcp<=r.hasta) return r.slope;
    if (hcp < rows[0].desde) return rows[0].slope;
    let best = rows[0];
    for (const r of rows) if (r.desde <= hcp) best = r;
    return best.slope;
  }
  const t = (CAT.tees[campoId]||{})[tee];
  if (t) return Math.round(hcp * t.sr/113 + (t.cr - t.par));
  return null;
}

/* golpes de ventaja en un hoyo según su índice (reparto WHS).
   Hándicap "plus" (negativo): devuelve golpes empezando por el índice 18 */
function strokesReceived(slope, holeHcp){
  if (!slope) return 0;
  if (slope > 0){ const base=Math.floor(slope/18), extra=slope%18; return base + (holeHcp<=extra?1:0); }
  const n=-slope, base=Math.floor(n/18), extra=n%18;
  return -(base + (holeHcp > 18-extra ? 1 : 0));
}
/* puntos Stableford: 2 al par neto, +1 por golpe por debajo, −1 por encima, mínimo 0 */
function stablefordPts(netVsPar){ return Math.max(0, 2 - netVsPar); }

/* ---------------- partida ---------------- */
let MATCH = null;
function rowToPlayer(j){
  const g = Array.isArray(j.golpes) ? j.golpes : [];
  const holes = Array.from({length:HOLES},(_,i)=>{ const v=g[i]; return (v===null||v===undefined||v==='') ? null : Number(v); });
  return { id:j.id, name:j.nombre, hcp:j.hcp==null?null:Number(j.hcp), tee:j.tee||TEE_DEFAULT,
           slope:Number(j.hcp_campo)||0, holes,
           currentHole:Math.min(HOLES-1, Math.max(0, j.hoyo_actual||0)), isMaster:!!j.is_master };
}
async function fetchMatch(code){
  const { data:p, error } = await sb.from('partidas').select('*').eq('code', code).maybeSingle();
  if (error) throw error;
  if (!p) return null;
  const { data:js, error:e2 } = await sb.from('jugadores_partida').select('*').eq('partida_code', code).order('created_at', {ascending:true});
  if (e2) throw e2;
  const campo = CAT.byId[p.campo_id];
  return {
    code:p.code, campoId:p.campo_id, campoName: campo ? campo.nombre : (p.campo_nombre_libre || 'Campo'),
    sistema: p.sistema==='stableford' ? 'stableford' : 'medal', status:p.status,
    createdAt: Date.parse(p.created_at) || Date.now(), players:(js||[]).map(rowToPlayer)
  };
}

/* escrituras propias: mientras hay una en vuelo (o hace <3s), un refresco
   en tiempo real no pisa mis datos locales con una lectura anterior */
let pendingWrites=0, myDirtyUntil=0;
async function savePlayer(player, fields){
  pendingWrites++; myDirtyUntil = Date.now()+3000;
  try{
    const { error } = await sb.from('jugadores_partida').update(fields).eq('id', player.id);
    if (error) throw error;
  } catch(e){
    console.error(e); toast('No se pudo guardar. Revisa la conexión e inténtalo de nuevo.');
    throw e;
  } finally { pendingWrites--; myDirtyUntil = Date.now()+3000; }
}

/* ---------------- Realtime ---------------- */
let rtChannel=null, rtCode=null, refreshTimer=null;
function subscribe(code){
  if (rtCode===code && rtChannel) return;
  unsubscribe(); rtCode=code;
  rtChannel = sb.channel('partida-'+code)
    .on('postgres_changes', { event:'*', schema:'public', table:'jugadores_partida', filter:`partida_code=eq.${code}` }, scheduleRefresh)
    .on('postgres_changes', { event:'*', schema:'public', table:'partidas', filter:`code=eq.${code}` }, scheduleRefresh)
    .subscribe();
}
function unsubscribe(){ if (rtChannel){ sb.removeChannel(rtChannel); } rtChannel=null; rtCode=null; }
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(refreshMatch, 250); }
async function refreshMatch(){
  if (!MATCH) return;
  const code = MATCH.code;
  let fresh; try{ fresh = await fetchMatch(code); }catch(e){ return; }
  if (!fresh || !MATCH || MATCH.code!==code) return;
  const myId = CURRENT.playerId;
  if (myId && (pendingWrites>0 || Date.now()<myDirtyUntil)){
    const localMe = MATCH.players.find(p=>p.id===myId);
    const i = fresh.players.findIndex(p=>p.id===myId);
    if (localMe && i>-1) fresh.players[i] = localMe;
  }
  MATCH = fresh;
  if (fresh.status==='closed' && CURRENT.screen==='play'){
    CURRENT = { screen:'results', code, playerId:myId };
    toast('El master ha cerrado la partida. Clasificación final.', true);
  }
  if (CURRENT.screen==='play' || CURRENT.screen==='results') render();
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) refreshMatch(); });

/* abre una partida: con jugador → juego; sin jugador → unirse; cerrada → clasificación */
async function openMatch(code, playerId){
  const m = await fetchMatch(code);
  if (!m) return false;
  if (playerId && !m.players.some(p=>p.id===playerId)) playerId = null;
  MATCH = m; subscribe(code);
  if (playerId) Session.set(code, playerId);
  if (m.status==='closed') CURRENT = { screen:'results', code, playerId };
  else if (playerId) CURRENT = { screen:'play', code, playerId };
  else CURRENT = { screen:'unirse2', code, data:{} };
  render();
  return true;
}
function goHome(){ unsubscribe(); MATCH=null; CURRENT={screen:'home'}; render(); }

/* ---------------- cálculos de clasificación ---------------- */
function playerCalc(m, p){
  const ch = courseHoles(m.campoId);
  const played = p.holes.filter(h=>h!==null).length;
  const strokes = p.holes.reduce((a,h)=>a+(h||0),0);
  if (m.sistema==='stableford'){
    let pts=0;
    p.holes.forEach((g,i)=>{ if (g===null) return; pts += stablefordPts((g - strokesReceived(p.slope, ch[i].hcp)) - ch[i].par); });
    return { played, strokes, pts };
  }
  if (!played) return { played, strokes:0, neto:0, diff:0 };
  // en vivo: Par de los hoyos jugados y SLOPE prorrateado; a 18 hoyos es la fórmula exacta
  const parPlayed = p.holes.reduce((a,h,i)=>a+(h===null?0:ch[i].par),0);
  const slopePart = p.slope*played/HOLES;
  return { played, strokes, neto:Math.round(strokes-slopePart), diff:Math.round(strokes-slopePart-parPlayed) };
}
function orderedPlayers(m){
  const rows = m.players.map(p=>({ p, ...playerCalc(m,p) }));
  if (m.sistema==='stableford') return rows.sort((a,b)=>(b.pts-a.pts) || (a.played-b.played));
  // Medal: a igualdad de diferencia, gana quien tiene más hoyos terminados
  return rows.sort((a,b)=>(a.diff-b.diff) || (b.played-a.played));
}

/* tabla compartida: una fila por SLOPE, con el tramo Amarillo y el Rojo que le corresponden */
function buildShared(campoId){
  const t = CAT.tramos[campoId] || {};
  const rows = [];
  for (const [tee,key] of [['Amarillo','am'],['Rojo','ro']]){
    for (const r of (t[tee]||[])){
      let row = rows.find(x=>x.slope===r.slope && x[key+'Desde']===null);
      if (!row){ row={slope:r.slope,amDesde:null,amHasta:null,roDesde:null,roHasta:null}; rows.push(row); }
      row[key+'Desde']=r.desde; row[key+'Hasta']=r.hasta;
    }
  }
  return rows.sort((a,b)=>a.slope-b.slope);
}
function buildEdit(campoId){
  return { slope: buildShared(campoId), holes: courseHoles(campoId).map(h=>({...h})) };
}

      const tc=(CAT.tees[c.id]||{})[t];
      return tc ? `${t}: sin tabla, se calcula con CR ${tc.cr} / SR ${tc.sr}.` : `${t}: sin tabla ni CR/SR — el SLOPE será 0 hasta que se cargue.`;
    });
    const box=card(`${avisos.length?`<div class="warn" style="margin-bottom:12px;">${avisos.map(esc).join('<br>')}</div>`:''}
      <p class="sub">Tu hándicap personal (desde–hasta) según color de salida → SLOPE en este campo.</p>
      <div class="tbl-scroll"><table class="slope-shared">
        <thead>
          <tr><th colspan="2" class="hdr-amarillo">Amarillo</th><th colspan="2" class="hdr-rojo">Rojo</th><th rowspan="2">SLOPE</th><th rowspan="2"></th></tr>
          <tr><th>Desde</th><th>Hasta</th><th>Desde</th><th>Hasta</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table></div>
      <button class="link-btn" id="addRow">+ añadir tramo</button>
      <button class="btn btn-gold btn-block" id="bSave" style="margin-top:14px;">Guardar</button><div class="err" id="sm"></div>`);
    w.appendChild(box);
    const body=box.querySelector('#rows');
    const val=v=>(v===null||v===undefined)?'':v;
    function paint(){
      body.innerHTML='';
      data.slope.forEach((r,i)=>{
        body.appendChild(el(`<tr>
          <td><input type="number" step="0.1" value="${val(r.amDesde)}" data-f="amDesde" data-i="${i}"></td>
          <td><input type="number" step="0.1" value="${val(r.amHasta)}" data-f="amHasta" data-i="${i}"></td>
          <td><input type="number" step="0.1" value="${val(r.roDesde)}" data-f="roDesde" data-i="${i}"></td>
          <td><input type="number" step="0.1" value="${val(r.roHasta)}" data-f="roHasta" data-i="${i}"></td>
          <td><input type="number" step="1" value="${val(r.slope)}" data-f="slope" data-i="${i}"></td>
          <td><button class="mini-x" data-del="${i}" aria-label="Quitar tramo">×</button></td>
        </tr>`));
      });
      body.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
        const n=parseNum(inp.value);
        data.slope[inp.dataset.i][inp.dataset.f] = isNaN(n) ? null : (inp.dataset.f==='slope'?Math.round(n):n);
      });
      body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.slope.splice(parseInt(b.dataset.del),1);paint();});
    }
    paint();
    box.querySelector('#addRow').onclick=()=>{data.slope.push({slope:null,amDesde:null,amHasta:null,roDesde:null,roHasta:null});paint();};
    box.querySelector('#bSave').onclick=async()=>{
      const m=box.querySelector('#sm'); m.className='err';
      const tramos=[];
      for (const [i,r] of data.slope.entries()){
        if (r.slope===null){ m.textContent=`Fila ${i+1}: falta el SLOPE.`; return; }
        for (const [tee,key] of [['Amarillo','am'],['Rojo','ro']]){
          const d=r[key+'Desde'], h=r[key+'Hasta'];
          if (d===null && h===null) continue;
          if (d===null || h===null){ m.textContent=`Fila ${i+1}: completa desde y hasta de ${tee}.`; return; }
          if (d>h){ m.textContent=`Fila ${i+1}: en ${tee}, "desde" es mayor que "hasta".`; return; }
          tramos.push({tee,desde:d,hasta:h,slope:r.slope});
        }
      }
      await saveCampo(c.id, tramos, null, m);
    };
  } else {
    const box=card(`<p class="sub">18 hoyos fijo. Par y hándicap de cada hoyo (1 = más difícil).</p>
      <div class="tbl-scroll"><table><thead><tr><th>Hoyo</th><th>Par</th><th>Hcp.</th></tr></thead><tbody id="hrows"></tbody></table></div>

    w.appendChild(box);
    const body=box.querySelector('#hrows');
    data.holes.forEach((h,i)=>body.appendChild(el(`<tr><td>${h.n}</td><td><input type="number" min="3" max="6" value="${h.par}" data-f="par" data-i="${i}"></td><td><input type="number" min="1" max="18" value="${h.hcp}" data-f="hcp" data-i="${i}"></td></tr>`)));
    body.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{data.holes[inp.dataset.i][inp.dataset.f]=parseInt(inp.value)||0;});
    box.querySelector('#bSaveH').onclick=async()=>{
      const m=box.querySelector('#sm2'); m.className='err';
      if (data.holes.some(h=>h.par<3||h.par>6)){ m.textContent='El par de cada hoyo debe estar entre 3 y 6.'; return; }
      const idx=data.holes.map(h=>h.hcp).sort((a,b)=>a-b);
      if (idx.some((v,i)=>v!==i+1)){ m.textContent='El hándicap de los hoyos debe usar cada número del 1 al 18 una sola vez.'; return; }
      await saveCampo(c.id, null, data.holes.map(h=>({numero:h.n,par:h.par,indice:h.hcp})), m);
    };
  }
  return w;
}
async function saveCampo(campoId, tramos, hoyos, msgEl){
  msgEl.textContent='Guardando…';
  const { error } = await sb.rpc('admin_guardar_campo', { p_clave:ADMIN_KEY, p_campo_id:campoId, p_tramos:tramos, p_hoyos:hoyos });
  if (error){
    console.error(error);
    msgEl.textContent = /clave/i.test(error.message||'') ? 'Clave incorrecta. Vuelve a entrar en Campos.' : 'No se pudo guardar (conexión).';
    return;
  }
  try{ await loadCatalog(); }catch(e){}
  msgEl.className='err ok-msg'; msgEl.textContent='✓ Guardado';
}

  n.oninput=()=>{ d.name=n.value; };
  h.oninput=()=>{ d.hcp=h.value; upd(); };
  teeChips(w.querySelector('#tees'), d, upd); upd();
  w.querySelector('#b').onclick=()=>{unsubscribe();MATCH=null;CURRENT={screen:'unirse1',data:{}};render();};
  const ok=w.querySelector('#ok');
  ok.onclick=async()=>{
    const e=w.querySelector('#e');
    const name=n.value.trim(); const hcp=parseNum(h.value);
    if(!name){e.textContent='Escribe tu nombre.';return;}
    if(m.players.some(p=>p.name.trim().toLowerCase()===name.toLowerCase())){e.textContent='Ya hay un jugador con ese nombre. Si eres tú, tócalo arriba.';return;}
    if(isNaN(hcp)||hcp<-10||hcp>54){e.textContent='Introduce un hándicap válido (entre -10 y 54).';return;}
    ok.disabled=true; ok.textContent='Uniéndote…'; e.textContent='';
    try{
      const slope=slopeFor(m.campoId,d.tee,hcp) ?? 0;
      const { data:row, error } = await sb.from('jugadores_partida').insert({
        partida_code:m.code, nombre:name, hcp, hcp_campo:slope, tee:d.tee, is_master:false, hoyo_actual:0, golpes:new Array(HOLES).fill(null)
      }).select().single();
      if (error) throw error;
      await openMatch(m.code, row.id);
    }catch(err){
      console.error(err); ok.disabled=false; ok.textContent='Unirme';
      e.textContent='No se pudo unir a la partida (revisa la conexión).';
    }
  };
  return w;
}

/* ---------- JUGAR ---------- */
function summaryTable(m, ordered, myId, withHoles){
  const isMedal = m.sistema==='medal';
  const head = isMedal
    ? `<tr><th>#</th><th>Nombre</th>${withHoles?'<th>Hoyos</th>':''}<th>Golpes</th><th>Hcp</th><th>SLOPE</th><th>Neto</th><th>Dif.</th></tr>`
    : `<tr><th>#</th><th>Nombre</th>${withHoles?'<th>Hoyos</th>':''}<th>Hcp</th><th>SLOPE</th><th>Puntos</th></tr>`;
  const rows = ordered.map((r,i)=>{
    const name = `${esc(r.p.name)}${r.p.isMaster?' 👑':''}`;
    const holesTd = withHoles ? `<td>${r.played}/${HOLES}</td>` : '';
    const cls = r.p.id===myId ? ' class="me"' : '';
    if (isMedal) return `<tr${cls}><td class="pos">${i+1}</td><td>${name}</td>${holesTd}<td>${r.strokes}</td><td>${r.p.hcp??'-'}</td><td>${r.p.slope}</td><td>${r.neto}</td><td class="diff">${fmtDiff(r.diff)}</td></tr>`;
    return `<tr${cls}><td class="pos">${i+1}</td><td>${name}</td>${holesTd}<td>${r.p.hcp??'-'}</td><td>${r.p.slope}</td><td class="diff">${r.pts}</td></tr>`;
  }).join('');
  return `<div class="tbl-scroll"><table class="summary-table"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function Play(){
  const m=MATCH;
  const me=m && m.players.find(p=>p.id===CURRENT.playerId);
  if (!me){ Session.clear(); CURRENT={screen:'home'}; return Home(); }
  const hi=me.currentHole;
  const ch=courseHoles(m.campoId);
  const holeData=ch[hi];
  const cur=me.holes[hi];
  const pend=CURRENT.pending && CURRENT.pending.hole===hi ? CURRENT.pending.val : null;
  let val = pend ?? cur ?? holeData.par;
  const w=document.createElement('div');

  const topbar=el(`<div class="play-topbar">
    <div class="row" style="gap:8px;">
      <button class="btn btn-outline btn-sm" id="bMenu">MENÚ</button>
      <button class="btn wa-btn btn-sm" id="wa">📲 Invitar por WhatsApp</button>
    </div>
    <div style="text-align:right;"><div style="font-size:10px;letter-spacing:1px;color:rgba(246,243,233,.55);text-transform:uppercase;">Nº Partida</div><div class="code-badge">${esc(m.code)}</div></div>
  </div>`);
  topbar.querySelector('#bMenu').onclick=goHome;
  topbar.querySelector('#wa').onclick=()=>{
    const link=location.origin+location.pathname+'?code='+m.code;
    const text=`⛳ ¡Únete a la partida en ${m.campoName}! Código: ${m.code}\n${link}`;
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  };
  w.appendChild(topbar);

  const ordered=orderedPlayers(m);
  const myPos=ordered.findIndex(r=>r.p.id===me.id)+1;
  const fecha=new Date(m.createdAt).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  w.appendChild(el(`<div>
    <div class="play-topbar" style="align-items:flex-end;margin-bottom:8px;">
      <div><div style="font-family:'Bebas Neue';font-size:26px;color:#fff;line-height:1;">${esc(me.name)}</div>
        <div style="font-size:12px;color:rgba(246,243,233,.6);margin-top:2px;">Hcp ${me.hcp??'-'} · SLOPE ${me.slope}</div></div>
      <div style="text-align:right;"><div style="font-size:10px;letter-spacing:1px;color:rgba(246,243,233,.55);text-transform:uppercase;">Posición</div>
        <div style="font-family:'Bebas Neue';font-size:26px;color:var(--dorado-claro);">${myPos}/${m.players.length}</div></div>
    </div>
    <div class="row" style="gap:6px;margin-bottom:14px;">
      <span class="meta-chip">📅 ${fecha}</span>
      <span class="meta-chip">⛳ ${esc(m.campoName)}</span>
      <span class="meta-chip">${sistemaLabel(m.sistema)}</span>
      <span class="meta-chip"><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${TEE_COLOR[me.tee]||'#fff'}"></span>${esc(me.tee)}</span>
    </div>
  </div>`));

  const summary=card(`<h4>Jugadores (${m.players.length})</h4>${summaryTable(m, ordered, me.id, true)}`);
  summary.classList.add('summary-card');
  w.appendChild(summary);

  /* tarjeta de anotación */
  const allMine = me.holes.every(h=>h!==null);
  const sc=card(''); sc.classList.add('score-card');
  sc.innerHTML=`
    <div class="gold-pair">
      <div class="gold-box"><div class="num">${hi+1}</div><div class="lbl">Hoyo</div>
        <div class="navrow"><button class="nav-btn" id="prev" ${hi===0?'disabled':''}>‹ Anterior</button><button class="nav-btn" id="next" ${hi===HOLES-1?'disabled':''}>Siguiente ›</button></div>
      </div>
      <div class="gold-box"><div class="num ${val<holeData.par?'circled':''}" id="sv">${val}</div><div class="lbl">Golpes${cur!==null?' · registrado':''}</div>
        <div class="navrow"><button class="stepper-btn" id="minus" aria-label="Un golpe menos">−</button><button class="stepper-btn" id="plus" aria-label="Un golpe más">+</button></div>
      </div>
    </div>
    <div class="small-gold-pair">
      <div class="small-gold"><div class="v">${holeData.par}</div><div class="k">Par del hoyo</div></div>
      <div class="small-gold"><div class="v">${holeData.hcp}</div><div class="k">Hándicap del hoyo</div></div>
    </div>
    <button class="btn btn-red btn-block" id="reg">${cur!==null?'Actualizar':'Registrar'}</button>
    ${me.isMaster?`<button class="btn btn-gold btn-block" id="cerrar" style="margin-top:10px;" ${allMine?'':'disabled'}>Cerrar partida</button>
      ${allMine?'':`<div class="note">Debes registrar tus 18 hoyos antes de poder cerrar la partida.</div>`}`:''}
  `;
  w.appendChild(sc);
  const sv=sc.querySelector('#sv');
  const setVal=v=>{ val=v; CURRENT.pending={hole:hi,val}; sv.textContent=val; sv.classList.toggle('circled', val<holeData.par); };
  sc.querySelector('#minus').onclick=()=>setVal(Math.max(1,val-1));
  sc.querySelector('#plus').onclick=()=>setVal(Math.min(20,val+1));
  const goHole=i=>{ me.currentHole=i; CURRENT.pending=null; render(); savePlayer(me,{hoyo_actual:i}).catch(()=>{}); };
  sc.querySelector('#prev').onclick=()=>goHole(Math.max(0,hi-1));
  sc.querySelector('#next').onclick=()=>goHole(Math.min(HOLES-1,hi+1));
  sc.querySelector('#reg').onclick=async()=>{
    const prevHoles=[...me.holes], prevHole=me.currentHole;
    me.holes[hi]=val;
    // tras registrar, salta al siguiente hoyo pendiente (o al siguiente si ya estaban todos)
    let next=hi;
    for (let k=1;k<=HOLES;k++){ const j=(hi+k)%HOLES; if (me.holes[j]===null){ next=j; break; } }
    if (me.holes.every(h=>h!==null)) next=Math.min(HOLES-1,hi+1);
    me.currentHole=next; CURRENT.pending=null; render();
    try{ await savePlayer(me,{ golpes:me.holes, hoyo_actual:me.currentHole }); }
    catch(e){ me.holes=prevHoles; me.currentHole=prevHole; CURRENT.pending={hole:hi,val}; render(); }
  };
  const bc=sc.querySelector('#cerrar');
  if (bc) bc.onclick=async()=>{
    const pendientes=m.players.filter(p=>p.holes.some(h=>h===null));
    const msg = pendientes.length
      ? `Hay jugadores que no han terminado:\n${pendientes.map(p=>`• ${p.name} (${p.holes.filter(h=>h!==null).length}/${HOLES})`).join('\n')}\n\n¿Cerrar la partida igualmente?`
      : '¿Cerrar la partida? Ya no se podrán registrar más golpes.';
    if (!confirm(msg)) return;
    bc.disabled=true;
    const { error } = await sb.from('partidas').update({ status:'closed', closed_at:new Date().toISOString() }).eq('code', m.code);
    if (error){ bc.disabled=false; toast('No se pudo cerrar la partida (conexión).'); return; }
    m.status='closed'; CURRENT={screen:'results',code:m.code,playerId:me.id}; render();
  };

  w.appendChild(el(`<h5 style="font-family:'Bebas Neue';font-size:15px;letter-spacing:.6px;color:var(--dorado-claro);margin:16px 0 6px;">Tus golpes por hoyo</h5>`));
  const myPanel=document.createElement('div'); myPanel.className='holes-panel';
  myPanel.appendChild(PlayerHoleTable(m,me,0,9,'IDA (1-9)'));
  myPanel.appendChild(PlayerHoleTable(m,me,9,18,'VUELTA (10-18)'));
  w.appendChild(myPanel);

  const showAll=!!CURRENT.showAll;
  const toggleBtn=el(`<button class="btn btn-outline btn-block" style="margin-top:14px;">${showAll?'✕ Ocultar golpes por hoyo':'📋 Ver golpes por hoyo de todos'}</button>`);
  w.appendChild(toggleBtn);
  if (showAll){
    const panel=document.createElement('div'); panel.className='holes-panel';
    panel.appendChild(AllPlayersHoleTable(m,0,9,'IDA (1-9)'));
    panel.appendChild(AllPlayersHoleTable(m,9,18,'VUELTA (10-18)'));
    w.appendChild(panel);
  }
  toggleBtn.onclick=()=>{ CURRENT.showAll=!showAll; render(); };
  return w;
}

/* tabla Par | Hcp | Golpes | Neto | Puntos (Stableford) de un jugador, ida o vuelta */
function PlayerHoleTable(m,p,start,end,title){
  const ch=courseHoles(m.campoId);
  const isStb=m.sistema==='stableford';
  const wrap=el(`<div><h5>${title}</h5><div class="tbl-scroll"></div></div>`);
  const idxs=[]; for(let i=start;i<end;i++) idxs.push(i);
  const parRow=idxs.map(i=>ch[i].par);
  const hcpRow=idxs.map(i=>ch[i].hcp);
  const golRow=idxs.map(i=>p.holes[i]);
  const netoRow=idxs.map(i=>p.holes[i]===null?null:p.holes[i]-strokesReceived(p.slope,ch[i].hcp));
  const ptsRow=idxs.map((i,k)=>(!isStb||p.holes[i]===null)?null:stablefordPts(netoRow[k]-ch[i].par));
  const fila=(label,arr,total=true)=>{
    const vals=arr.filter(v=>v!==null);
    return `<tr><th style="text-align:left;">${label}</th>${arr.map(v=>`<td>${v===null?'-':v}</td>`).join('')}<td style="font-weight:800;">${total&&vals.length?vals.reduce((a,b)=>a+b,0):'-'}</td></tr>`;
  };
  const head=`<tr><th>Hoyo</th>${idxs.map(i=>`<th>${i+1}</th>`).join('')}<th>Total</th></tr>`;
  let body=fila('Par',parRow)+fila('Hcp',hcpRow,false)+fila('Golpes',golRow)+fila('Neto',netoRow);
  if (isStb) body+=fila('Puntos',ptsRow);
  wrap.querySelector('.tbl-scroll').innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  return wrap;
}
function AllPlayersHoleTable(m,start,end,title){
  const ch=courseHoles(m.campoId);
  const wrap=el(`<div><h5>${title}</h5><div class="tbl-scroll"></div></div>`);
  const idxs=[]; for(let i=start;i<end;i++) idxs.push(i);
  const sum=arr=>arr.reduce((a,b)=>a+b,0);
  const filaComun=(label,arr,total=true)=>`<tr><th style="text-align:left;">${label}</th>${arr.map(v=>`<td>${v}</td>`).join('')}<td style="font-weight:800;">${total?sum(arr):'-'}</td></tr>`;
  const filaJugador=p=>{
    const gol=idxs.map(i=>p.holes[i]); const vals=gol.filter(v=>v!==null);
    return `<tr><th style="text-align:left;">${esc(p.name)}${p.isMaster?' 👑':''}</th>${gol.map(v=>`<td>${v===null?'-':v}</td>`).join('')}<td style="font-weight:800;">${vals.length?sum(vals):'-'}</td></tr>`;
  };
  const head=`<tr><th>Hoyo</th>${idxs.map(i=>`<th>${i+1}</th>`).join('')}<th>Total</th></tr>`;
  const body=filaComun('Par',idxs.map(i=>ch[i].par))+filaComun('Hcp',idxs.map(i=>ch[i].hcp),false)+m.players.map(filaJugador).join('');
  wrap.querySelector('.tbl-scroll').innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  return wrap;
}

/* ---------- CLASIFICACIÓN FINAL ---------- */
function Results(){
  const m=MATCH;
  const w=document.createElement('div');
  const top=el(`<div class="row" style="margin-bottom:10px;"><button class="btn btn-outline" id="b">← Menú principal</button></div>`);
  top.querySelector('#b').onclick=()=>{ if (Session.get()?.code===m.code) Session.clear(); goHome(); };
  w.appendChild(top);
  w.appendChild(el(`<div><h2 class="title">Clasificación final</h2><p class="sub">Nº ${esc(m.code)} · ${esc(m.campoName)} · ${sistemaLabel(m.sistema)}</p></div>`));
  const ordered=orderedPlayers(m);
  const incompletos=ordered.some(r=>r.played<HOLES);
  const box=card(`${summaryTable(m, ordered, CURRENT.playerId, incompletos)}${incompletos?'<div class="note">Algunos jugadores no completaron los 18 hoyos; su resultado se calcula sobre los hoyos jugados.</div>':''}`);
  w.appendChild(box);
  const me=m.players.find(p=>p.id===CURRENT.playerId);
  if (me){
    w.appendChild(el(`<h5 style="font-family:'Bebas Neue';font-size:15px;letter-spacing:.6px;color:var(--dorado-claro);margin:16px 0 6px;">Tus golpes por hoyo</h5>`));
    const myPanel=document.createElement('div'); myPanel.className='holes-panel';
    myPanel.appendChild(PlayerHoleTable(m,me,0,9,'IDA (1-9)'));
    myPanel.appendChild(PlayerHoleTable(m,me,9,18,'VUELTA (10-18)'));
    w.appendChild(myPanel);
  }
  w.appendChild(el(`<h5 style="font-family:'Bebas Neue';font-size:15px;letter-spacing:.6px;color:var(--dorado-claro);margin:16px 0 6px;">Golpes por hoyo de todos</h5>`));
  const panel=document.createElement('div'); panel.className='holes-panel';
  panel.appendChild(AllPlayersHoleTable(m,0,9,'IDA (1-9)'));
  panel.appendChild(AllPlayersHoleTable(m,9,18,'VUELTA (10-18)'));
  w.appendChild(panel);
  return w;
}

/* ---------------- arranque ---------------- */
async function boot(){
  try{ await loadCatalog(); }
  catch(e){ console.error(e); CAT.error=e; render(); return; }
  // enlace compartido (?code=XXXX): si ya jugabas en esa partida entras directo; si no, a unirte
  const code=(new URLSearchParams(location.search).get('code')||'').trim();
  if (/^\d{4}$/.test(code)){
    history.replaceState(null,'',location.pathname);
    const s=Session.get();
    try{
      const found=await openMatch(code, s&&s.code===code ? s.playerId : null);
      if (found) return;
      CURRENT={screen:'unirse1',data:{prefillCode:code,prefillError:'No se encontró ninguna partida con el código '+code+'.'}};
    }catch(e){ CURRENT={screen:'unirse1',data:{prefillCode:code,prefillError:'No se pudo cargar la partida (conexión).'}}; }
  }
  render();
}
render();
boot();
</script>
